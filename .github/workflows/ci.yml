name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.3'
          bundler-cache: true
      - run: bundle exec rubocop
      - run: gem build noma4i-rubocop.gemspec
