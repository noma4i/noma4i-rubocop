Noma4i/EmptyLineBeforeImplicitReturn:
  Description: Separate implicit returns from earlier statements.
  Enabled: true
Noma4i/EmptyLineBeforeReturn:
  Description: Separate returns from earlier statements.
  Enabled: true
Noma4i/AsciiStringLiterals:
  Description: Use ASCII string literals.
  Enabled: true
Noma4i/EmptyControllerAction:
  Description: Remove empty controller actions with templates.
  Enabled: true
  Include:
  - 'app/controllers/**/*.rb'
  Exclude:
  - 'app/controllers/concerns/**/*'
Style/AsciiComments:
  Enabled: false
Noma4i/AsciiOnlyComments:
  Description: Use ASCII comments.
  Enabled: true
Noma4i/ControllerInstanceVariable:
  Description: Pass controller values as locals.
  Enabled: true
  Include:
  - 'app/controllers/**/*.rb'
Noma4i/TemplateInstanceVariable:
  Description: Use locals in templates.
  Enabled: true
  Include:
  - 'app/views/**/*.haml'
  - 'app/components/**/*.haml'
Noma4i/TemplateLocalAssignment:
  Description: Avoid assignments in templates.
  Enabled: true
  Include:
  - 'app/views/**/*.haml'
  - 'app/components/**/*.haml'
AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
  - '**/db/migrate/*'
  - '**/db/schema.rb'
  - '**/db/data_schema.rb'
  - '**/Gemfile'
  - '**/Gemfile.lock'
  - '**/Rakefile'
  - '**/rails'
  - '**/*.gemspec'
  - '**/vendor/**/*'
