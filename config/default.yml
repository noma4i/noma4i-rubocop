Noma4i/TemplateFileExtension:
  Description: Use one Haml template extension.
  Enabled: true
Noma4i/NoRawSql:
  Description: Use ActiveRecord or Arel instead of SQL strings.
  Enabled: true
  Include:
  - 'app/**/*.rb'
  - 'lib/**/*.rb'
  - 'lib/**/*.rake'
Noma4i/NoModuleFunction:
  Description: Use service classes instead of module functions.
  Enabled: true
  Include:
  - 'app/services/**/*.rb'
Noma4i/NoRescueStandardError:
  Description: Rescue specific exceptions.
  Enabled: true
  Include:
  - 'app/**/*.rb'
  - 'lib/**/*.rb'
  - 'lib/**/*.rake'
